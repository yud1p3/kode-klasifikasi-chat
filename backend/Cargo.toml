[package]
name = "kode-klasifikasi-chat"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono"] }
dotenv = "0.15"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"
actix-multipart = "0.8.0"
futures = "0.3.33"
jsonwebtoken = "9"

[profile.release]
opt-level = 2
