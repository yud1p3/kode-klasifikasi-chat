# ============================================================
# Nginx — Kode Klasifikasi Arsip (kode-klasifikasi-chat) VPS
# Disajikan di port 80 (domain ngrok VPS menunjuk ke sini).
#
# Pemakaian:
#   sudo ln -sf /etc/nginx/sites-available/kode-klasifikasi.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ PENTING — konflik domain: server block ini memakai `default_server`
# (server_name _). Jika domain ngrok ini sebelumnya dipakai aplikasi lain
# (mis. browser-klasifikasi-arsip) dengan `server_name` yang sama persis,
# nginx akan tetap mencocokkan request ke aplikasi lama (server_name match
# menang atas default_server) — yang tampil bukan chatbot. Nonaktifkan situs
# lama dulu sebelum reload:
#   sudo ls /etc/nginx/sites-enabled/
#   sudo rm /etc/nginx/sites-enabled/<config-lama>   # mis. klasifikasi-arsip.conf
# ============================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/kode-klasifikasi;
    index index.html;

    # Static assets — cache lama (hash file berubah tiap build)
    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|woff2?|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API → backend Rust (proxy; backend tidak boleh diekspos langsung)
    location /api/ {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # Gemini rerank bisa lama
        proxy_send_timeout 120s;
    }

    # SPA fallback — route React (mis. /auth/callback) → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Keamanan dasar
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
